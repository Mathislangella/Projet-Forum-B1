<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forum</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header class="site-header">
        <div class="header-content">
            <div class="header-logo"><a href="/home" class="brand-title">Forum</a></div>
            <nav class="header-nav">
                <a href="/connexion" class="nav-link">Connexion</a>
                <a href="/inscription" class="nav-link">Inscription</a>
            </nav>
        </div>
    </header>
    <div class="container">
        <main>
            <div class="hero-section">
                <h1>Bienvenue sur le Forum</h1>
                <p>Rejoignez la communauté, partagez vos idées et discutez avec d'autres membres.</p>
                <div class="hero-buttons">
                    <a href="/home" class="hero-button primary">Voir les discussions</a>
                    <a href="/inscription" class="hero-button secondary">Créer un compte</a>
                </div>
            </div>
        </main>
    </div>
    <footer class="site-footer"><p>&copy; 2026 Forum. Tous droits réservés.</p></footer>
    <script>
    // Redirige vers /home si déjà connecté
    fetch('/api/me').then(r => r.json()).then(u => { if (u) location.href = '/home'; });
    </script>
</body>
</html>
