<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nouveau sujet - Forum</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header class="site-header">
        <div class="header-content">
            <div class="header-logo"><a href="/home" class="brand-title">Forum</a></div>
            <div id="headerAuth"></div>
        </div>
    </header>

    <div class="container">
        <main>
            <p style="margin-bottom:1rem;"><a href="/home" style="color:#44c3cc;text-decoration:none;">← Retour</a></p>
            <div class="form-container" style="max-width:700px;">
                <h2>Créer un sujet</h2>
                <div id="message"></div>
                <form id="createForm" enctype="multipart/form-data">
                    <div class="form-group">
                        <label>Titre</label>
                        <input type="text" name="title" id="title" required placeholder="Titre de votre sujet">
                    </div>
                    <div class="form-group">
                        <label>Catégorie</label>
                        <select name="categoryId" id="categoryId" style="width:100%;padding:0.75rem;background:#151d27;color:#dce6f2;border:1px solid #34485c;border-radius:3px;">
                            <option value="">Choisir une catégorie...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Contenu</label>
                        <textarea name="body" id="body" required placeholder="Écrivez votre message..." style="width:100%;min-height:200px;background:#151d27;color:#dce6f2;border:1px solid #34485c;border-radius:3px;padding:0.75rem;font-family:inherit;resize:vertical;"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Image (optionnel — JPEG, PNG, GIF, max 20Mo)</label>
                        <input type="file" name="image" id="image" accept="image/jpeg,image/png,image/gif" style="color:#dce6f2;">
                    </div>
                    <button type="submit">Publier</button>
                </form>
            </div>
        </main>
    </div>

    <footer class="site-footer"><p>&copy; 2026 Forum.</p></footer>

    <script>
    async function init() {
        const user = await fetch('/api/me').then(r => r.json());
        if (!user) return location.href = '/connexion';

        document.getElementById('headerAuth').innerHTML = `<nav class="header-nav">
            <a href="/profil" class="nav-link">${user.username}</a>
            <a href="/logout" class="nav-link">Déconnexion</a>
        </nav>`;

        const cats = await fetch('/api/categories').then(r => r.json());
        const sel = document.getElementById('categoryId');
        cats.forEach(c => sel.innerHTML += `<option value="${c.id}">${c.name}</option>`);
    }

    document.getElementById('createForm').addEventListener('submit', async e => {
        e.preventDefault();
        const msg = document.getElementById('message');
        const formData = new FormData(e.target);

        const res = await fetch('/api/posts', { method: 'POST', body: formData });
        const data = await res.json();

        if (!res.ok) {
            msg.textContent = data.error || 'Erreur';
            msg.style.color = '#ff6b6b';
            return;
        }
        location.href = '/home';
    });

    init();
    </script>
</body>
</html>
