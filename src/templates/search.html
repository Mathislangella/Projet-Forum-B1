<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recherche - Forum</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header class="site-header">
        <div class="header-content">
            <div class="header-logo"><a href="/home" class="brand-title">Forum</a></div>
            <form class="search-form" id="searchForm">
                <button type="submit" class="search-button"><img src="/images/icon/search.png" alt=""></button>
                <input type="search" name="q" id="searchInput" placeholder="Rechercher..." class="search-input">
                <div class="search-option">
                    <div><input type="radio" name="type" value="users" id="type-users"><label for="type-users"><img src="/images/icon/user.png" alt=""></label></div>
                    <div><input type="radio" name="type" value="posts" id="type-posts" checked><label for="type-posts"><img src="/images/icon/post.png" alt=""></label></div>
                </div>
            </form>
            <div id="headerAuth"></div>
        </div>
    </header>

    <div class="container">
        <main>
            <div class="search-page">
                <div class="search-panel">
                    <div class="search-panel-header">
                        <h1>Recherche</h1>
                    </div>
                    <div id="results" style="padding:1rem;">
                        <p style="color:#8d9aac;">Entrez un terme pour rechercher.</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <footer class="site-footer"><p>&copy; 2026 Forum.</p></footer>

    <script>
    function escHtml(str) {
        return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    async function init() {
        const user = await fetch('/api/me').then(r => r.json());
        const el = document.getElementById('headerAuth');
        if (user) {
            el.innerHTML = `<nav class="header-nav"><a href="/profil" class="nav-link">${user.username}</a><a href="/logout" class="nav-link">Déconnexion</a></nav>`;
        } else {
            el.innerHTML = `<nav class="header-nav"><a href="/connexion" class="nav-link">Connexion</a><a href="/inscription" class="nav-link">Inscription</a></nav>`;
        }

        const params = new URLSearchParams(location.search);
        const q = params.get('q');
        const type = params.get('type') || 'posts';

        if (q) {
            document.getElementById('searchInput').value = q;
            if (type === 'users') document.getElementById('type-users').checked = true;
            search(q, type);
        }
    }

    document.getElementById('searchForm').addEventListener('submit', e => {
        e.preventDefault();
        const q = document.getElementById('searchInput').value.trim();
        const type = document.querySelector('input[name="type"]:checked').value;
        if (!q) return;
        history.pushState(null, '', `/search?q=${encodeURIComponent(q)}&type=${type}`);
        search(q, type);
    });

    async function search(q, type) {
        const results = await fetch(`/api/search?q=${encodeURIComponent(q)}&type=${type}`).then(r => r.json());
        const el = document.getElementById('results');

        if (results.length === 0) {
            el.innerHTML = '<p style="color:#8d9aac;padding:1rem;">Aucun résultat.</p>';
            return;
        }

        if (type === 'users') {
            el.innerHTML = results.map(u => `
                <div class="search-result">
                    <div class="result-content">
                        <h3 style="color:#44c3cc;">${escHtml(u.username)}</h3>
                        <p class="result-meta">Membre depuis le ${new Date(u.created_at).toLocaleDateString('fr-FR')}</p>
                    </div>
                </div>`).join('');
        } else {
            el.innerHTML = results.map(p => `
                <a href="/topic/${p.id}" style="text-decoration:none;">
                    <div class="search-result">
                        <div class="result-stats">
                            <span>${p.comment_count}</span><small>réponses</small>
                        </div>
                        <div class="result-content">
                            <h3>${escHtml(p.title)}</h3>
                            <p class="result-meta"><strong>${escHtml(p.username)}</strong> · ${escHtml(p.category)} · ${new Date(p.created_at).toLocaleDateString('fr-FR')}</p>
                            <p>${escHtml(p.body).substring(0, 150)}...</p>
                        </div>
                    </div>
                </a>`).join('');
        }
    }

    init();
    </script>
</body>
</html>
