<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil - Forum</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header class="site-header">
        <div class="header-content">
            <div class="header-logo"><a href="/home" class="brand-title">Forum</a></div>
            <div id="headerAuth"></div>
        </div>
    </header>

    <div class="container">
        <main>
            <div id="profilContent"></div>
        </main>
    </div>

    <footer class="site-footer"><p>&copy; 2026 Forum.</p></footer>

    <script>
    function escHtml(str) {
        return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    async function init() {
        const data = await fetch('/api/profil').then(r => r.json());
        if (data.error) return location.href = '/connexion';

        const { user, posts } = data;

        document.getElementById('headerAuth').innerHTML = `<nav class="header-nav">
            <a href="/home" class="nav-link">Accueil</a>
            <a href="/logout" class="nav-link">Déconnexion</a>
        </nav>`;

        document.getElementById('profilContent').innerHTML = `
            <div class="profile-banner">
                <div class="profile-info">
                    <div class="profile-avatar"><img src="/images/icon/user.png" alt="Avatar"></div>
                    <div class="profile-details">
                        <h1 class="profile-username">${escHtml(user.username)}</h1>
                        <p class="profile-status">${escHtml(user.email)}</p>
                        <p style="color:#8d9aac;font-size:0.85rem;margin-top:0.3rem;">Membre depuis le ${new Date(user.created_at).toLocaleDateString('fr-FR')}</p>
                    </div>
                </div>
                <div class="profile-stats-bar">
                    <div class="stat-item">
                        <span class="stat-label">Posts</span>
                        <span class="stat-value">${posts.length}</span>
                    </div>
                </div>
            </div>

            <div class="profile-activity">
                <h2>Mes posts</h2>
                <div class="activity-container">
                    ${posts.length === 0 ? '<p style="color:#8d9aac;">Aucun post publié.</p>' :
                    posts.map(p => `
                        <div class="activity-item">
                            <a href="/topic/${p.id}" style="text-decoration:none;">
                                <h3>${escHtml(p.title)}</h3>
                            </a>
                            <p>${escHtml(p.category)} · ${new Date(p.created_at).toLocaleDateString('fr-FR')} · ▲ ${p.likes} ▼ ${p.dislikes} · 💬 ${p.comment_count}</p>
                        </div>`).join('')}
                </div>
            </div>

            <div class="profile-footer-actions">
                <a href="/logout" class="logout-button">Se déconnecter</a>
            </div>`;
    }

    init();
    </script>
</body>
</html>
