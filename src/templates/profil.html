<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/style.css">
    <title>Profil - Forum</title>
</head>

<body class="page">

<script>
  window.PROFILE = JSON.parse(`{{PROFILE_JSON}}`);
</script>

<header class="site-header">
    <div class="header-content">

        <div class="header-logo">
            <a href="/home" class="brand-title">Forum</a>
        </div>

        <form class="search-form" action="/search" method="get">
            <button type="submit" class="search-button">
                <img src="/images/icon/search.png" alt="Recherche">
            </button>

            <input type="search" name="q" placeholder="Rechercher..." class="search-input">

            <div class="search-option">
                <div>
                    <input type="radio" name="type" value="users" id="type-users">
                    <label for="type-users">
                        <img src="/images/icon/user.png" alt="Utilisateurs">
                    </label>
                </div>

                <div>
                    <input type="radio" name="type" value="posts" id="type-posts" checked>
                    <label for="type-posts">
                        <img src="/images/icon/post.png" alt="Posts">
                    </label>
                </div>
            </div>
        </form>

        <div class="user-menu-container">
            <button class="user-menu-trigger">
                <img src="/images/avatar.png" class="user-avatar">
                <span class="user-name" id="usernameDisplay"></span>
                <span class="dropdown-arrow">▼</span>
            </button>

            <div class="user-menu-dropdown">
                <div class="menu-section">
                    <p class="menu-section-title">CONTENU</p>

                    <a href="/profil" class="menu-icon-item">
                        <img src="/images/icon/user.png">
                        Profil
                    </a>
                </div>

                <div class="menu-section">
                    <p class="menu-section-title">PARAMÈTRES</p>

                    <a href="/profil/edit" class="menu-icon-item">
                        <img src="/images/icon/settings.png">
                        Paramètres
                    </a>

                    <a href="/logout" class="menu-icon-item logout">
                        <img src="/images/icon/logout.png">
                        Déconnexion
                    </a>
                </div>
            </div>
        </div>

    </div>
</header>

<div class="container">
<main class="content profile-page">

<!-- ACTION BAR -->
<div id="owner-bar" class="profile-action-bar">
    <a href="/profil/settings">⚙️ Paramètres</a>
    <a href="/profil/edit" class="primary">✎ Modifier</a>
    <a href="/logout">🚪 Déconnexion</a>
</div>

<div id="visitor-bar" class="profile-action-bar">
    <button>➕ Suivre</button>
    <button>📜 Activité</button>
</div>

<section class="profile-banner">

    <div class="profile-info">
        <div class="profile-avatar">
            <img src="/images/avatar.png">
        </div>

        <div class="profile-details">
            <h2 id="profileUsername"></h2>
        </div>
    </div>

</section>

</main>
</div>

<footer class="site-footer">
    <p>&copy; 2026 Forum</p>
</footer>

<script>
// PROFILE DATA
const profile = window.PROFILE;

// username affichage
document.getElementById("usernameDisplay").textContent = profile.username;
document.getElementById("profileUsername").textContent = profile.username;

// owner / visitor
const isOwner = profile.isOwner;

document.getElementById("owner-bar").style.display = isOwner ? "flex" : "none";
document.getElementById("visitor-bar").style.display = isOwner ? "none" : "flex";

// dropdown
const trigger = document.querySelector('.user-menu-trigger');
const dropdown = document.querySelector('.user-menu-dropdown');

trigger.addEventListener('click', (e) => {
    e.stopPropagation();
    dropdown.classList.toggle('active');
});

document.addEventListener('click', () => {
    dropdown.classList.remove('active');
});
</script>

</body>
</html>
